version: 2

builds:
  - id: agent-ios
    main: ./cmd/agent-ios
    binary: agent-ios
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: agent-ios
    ids:
      - agent-ios
    formats:
      - binary
    name_template: "agent-ios_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  github:
    owner: edxeth
    name: agent-ios
