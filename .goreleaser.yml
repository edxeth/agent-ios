version: 2

builds:
  - id: agent-ios
    main: ./cmd/agent-ios
    binary: agent-ios
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: agent-ios
    builds:
      - agent-ios
    format: binary
    name_template: "agent-ios_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: nnemirovsky
    name: agent-ios
