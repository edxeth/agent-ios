name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - OS and version
        - iOS version
        - iwdp-cli version (release tag, or the version that `iwdp-cli daemon status` prints)
        - ios-webkit-debug-proxy version
        - How iwdp-cli runs (shell, or the agent that calls it)
