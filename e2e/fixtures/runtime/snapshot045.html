<script>
  customElements.define("my-el", class extends HTMLElement { constructor() {
    super(); this.attachShadow({ mode: "open" }).innerHTML =
      '<div onclick="void 0" style="cursor:pointer">Shadow clickable</div>'; } });
  customElements.define("host-ptr", class extends HTMLElement { constructor() {
    super(); this.attachShadow({ mode: "open" }).innerHTML = "<div>Inherited pointer inner</div>"; } });
  customElements.define("host-slot", class extends HTMLElement { constructor() {
    super(); this.attachShadow({ mode: "open" }).innerHTML = '<div style="cursor:pointer"><slot></slot></div>'; } });
  // A chain of five nested same-origin iframes; level k shows "Level k".
  function nest(k) {
    var inner = k < 5 ? '<iframe name="level' + (k + 1) + '" srcdoc="' + nest(k + 1).replace(/&/g, "&amp;").replace(/"/g, "&quot;") + '"></iframe>' : "";
    return "<button>Level " + k + "</button>" + inner;
  }
  document.getElementById("nest").srcdoc = nest(1);
  window.__mutations = 0;
  new MutationObserver(function (r) { window.__mutations += r.length; })
    .observe(document, { attributes: true, childList: true, subtree: true });
</script>
